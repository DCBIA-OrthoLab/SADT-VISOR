name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job reads the checkout and nothing else: the token GitHub hands it
# can do no more than that, whatever a dependency it installs tries.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is read off the filesystem rather than written down here, so
  # adding a tool never means editing this file. A directory joins the matrix
  # the moment it has a pyproject.toml.
  discover:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          # Depth 2 AND 3, and keyed on [tool.sadt], which is the same rule
          # the server's registry and the deployment Dockerfile use. Depth 2
          # alone stopped matching when ALI and AREG became grouping folders:
          # CI went on testing six tools and silently dropped the five the
          # splits produced -- which is where the stale tests were found, months
          # later, by hand. [tool.sadt] also drops _template, which CI was
          # testing and no server ever serves.
          tools=$(find tools -mindepth 2 -maxdepth 3 -name pyproject.toml -printf '%h\n' \
            | while read -r dir; do
                grep -q '^\[tool.sadt\]' "$dir/pyproject.toml" && echo "$dir"
              done | sed 's|^tools/||' | sort | jq -R . | jq -sc .)
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "matrix: $tools"

  tool:
    needs: discover
    if: needs.discover.outputs.tools != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One tool's broken lockfile says nothing about the others, and finding
      # out about all of them in one run beats six round trips.
      fail-fast: false
      matrix:
        tool: ${{ fromJson(needs.discover.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # --frozen, not a plain sync: this fails when uv.lock no longer matches
      # pyproject.toml, which is the whole point of committing the lock.
      - name: Sync from the committed lockfile
        working-directory: tools/${{ matrix.tool }}
        run: uv sync --frozen

      # Runs with the TOOL's interpreter, not the runner's: importing a tool
      # needs the tool's dependencies. It fails on an unsupported annotation,
      # so a schema the client cannot render never reaches main.
      - name: Import and schema
        env:
          TOOL: ${{ matrix.tool }}
        run: tools/"$TOOL"/.venv/bin/python scripts/describe.py tools/"$TOOL"

      # GPU tests are excluded here because the runner has no CUDA device. They
      # are not optional: run them by hand and state the result in the PR.
      #
      # Integration tests that reach for another tool skip themselves here --
      # each tool gets its own job, so no other tool's .venv exists in this one.
      # That is what `sadt_testkit.is_built` is for.
      - name: Tests
        working-directory: tools/${{ matrix.tool }}
        run: uv run --frozen pytest -m "not gpu"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # --no-project: scripts/ is deliberately not a package. There is no
      # repository-level environment for a tool venv to be confused with.
      - name: Tests
        run: uv run --no-project --python 3.12 --with pytest -- pytest scripts/tests -q
      - name: Audit
        run: uv run scripts/audit.py

  # The testkit is what every integration test trusts, so it is tested itself.
  # It builds tools/_template because that is what its suite runs against, and
  # the template is the one tool that is always cheap to build.
  testkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Build the template it runs against
        working-directory: tools/_template
        run: uv sync --frozen
      - name: Tests
        working-directory: testkit
        run: uv run --frozen pytest -q
