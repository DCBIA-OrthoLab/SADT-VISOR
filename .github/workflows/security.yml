name: security

# What a library run on confidential imaging depends on: no credential lands in
# the history, the Python carries no known-dangerous pattern, the workflows
# cannot be turned against the repository, and every tool's lockfile is
# checked against the published advisories.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a rule or an advisory published upstream reaches a tool nobody
  # has touched since.
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history: a token removed in a later commit is still public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The image, pinned by digest, rather than gitleaks-action, which needs
      # a paid licence on an organisation's repository.
      - name: Scan the history
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --exit-code 1

  python:
    name: python (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install "bandit==1.9.*"
      # Medium severity and up fails the job. Tests are left out: their fixed
      # /tmp paths and fake servers are what tests are for. A finding that is
      # not one is marked `# nosec <rule>` with the reason on the line above.
      # B608 (SQL built from strings) is skipped: no tool holds a database,
      # and every hit is an error message built with an f-string.
      - name: Scan
        run: bandit -r . -x './.git,*/tests/*,*/test/*' -s B608 -ll -q

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: python -m pip install "zizmor==1.*"
      # Offline: the online audits call the GitHub API, and the runner's
      # token is read-only here anyway.
      - name: Audit
        run: zizmor --offline --min-severity medium .github/workflows

  # A REPORT, not a gate. Moving a tool to a patched pillow or monai can change
  # its masks, so the upgrade is a scientific decision taken with a
  # revalidation against reference data, never something a red check forces
  # into an unrelated pull request. The table lands in the run's summary.
  dependencies:
    name: dependencies (pip-audit report)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # torch's CUDA wheels are not on PyPI and are reported as not audited;
      # every other locked package is.
      - name: Audit every tool's lockfile
        run: |
          {
            echo "## Known vulnerabilities in the tools' lockfiles"
            echo
            echo "| tool | package | version | advisories | fixed in |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          clean=0
          for lock in $(find tools -mindepth 2 -maxdepth 3 -name uv.lock | sort); do
            dir=$(dirname "$lock")
            (cd "$dir" && uv export --frozen --no-hashes --no-emit-project --no-emit-local -q) > requirements.txt
            uvx --quiet "pip-audit==2.*" -r requirements.txt --no-deps --disable-pip \
                --progress-spinner off -f json -o audit.json >/dev/null 2>&1 || true
            rows=$(jq -r --arg tool "${dir#tools/}" '.dependencies[] | select((.vulns // []) | length > 0)
                     | "| \($tool) | \(.name) | \(.version) | \(.vulns | length) | \([.vulns[].fix_versions[]] | unique | join(", ")) |"' audit.json)
            if [ -n "$rows" ]; then echo "$rows" >> "$GITHUB_STEP_SUMMARY"; else clean=$((clean + 1)); fi
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "$clean lockfile(s) with no known vulnerability." >> "$GITHUB_STEP_SUMMARY"
