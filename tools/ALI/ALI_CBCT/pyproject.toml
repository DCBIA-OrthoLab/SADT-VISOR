[project]
name = "sadt-ali-cbct"
version = "0.1.0"
description = "Place anatomical landmarks on CBCT volumes with per-landmark deep-RL agents."
requires-python = ">=3.11,<3.12"
# No pytorch3d here, and so no reason to move torch. The intraoral engine is
# pinned to 2.11 because its pytorch3d wheel names that version exactly; this
# one was only ever dragged along by sharing a virtualenv with it, which is
# what the split undid.
dependencies = [
    # The markups writer and the extension vocabulary. A DIRECT dependency,
    # not merely a `tool.uv.sources` entry: a source only applies to a package
    # that is actually depended on, so declaring the path without this line
    # installs nothing and the import fails at runtime.
    "sadt-ali-common",
    "torch==2.8.0",
    "monai==1.6.0",
    "itk==5.4.7",
    "SimpleITK==2.5.6",
    "numpy==2.3.2",
    # Not used directly: torch pulls it in. From 3.30 it installs a process-wide
    # audit hook that raises on an os.fork while another thread is mid-fork with
    # a lock held ("os.fork is unsafe while filelock is changing descriptor
    # ownership"), which lost a structure in one AMASSS run in two. 3.29 has none.
    "filelock<3.30",
]

# What makes this directory a tool. A directory holding a pyproject.toml
# WITHOUT this section -- `../common`, `../../../testkit` -- is a plain
# package, importable and installable, never discovered or served.
[tool.sadt]
tool = true
# The API identity: what a client sends, what deployment.toml is keyed by, and
# what another tool passes to `sup.run()`. Declared rather than derived from the
# directory, so this tool keeps its name while living inside a grouping folder.
name = "ALI_CBCT"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_ali_cbct"]

# `explicit` is load-bearing: without it uv looks for EVERY package on the
# PyTorch index, and most of them are not there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# The markups writer and the input-extension vocabulary, shared with ALI_IOS
# because they are contracts with the outside world rather than internal code.
# See ../common/README.md; it has no dependencies of its own and cannot
# perturb the resolution above.
sadt-ali-common = { path = "../common" }
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does.
sadt-testkit = { path = "../../../testkit", editable = true }
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs the real CBCT model bundle. See tests/data/README.md.",
]
