[project]
name = "sadt-ali-ios"
version = "0.1.0"
description = "Place anatomical landmarks on intraoral surface scans with multi-view rendering."
requires-python = ">=3.11,<3.12"
# Aligned with upstream SlicerAutomatedDentalTools' shared "shapeaxi" env,
# which is where every pytorch3d-dependent module lives. Upstream leaves torch
# unpinned there; we are deliberately stricter, because the pytorch3d wheel tag
# (`+pt2110cu128`) names one torch version and one CUDA variant exactly, so the
# two move together or the C extension does not load. See README.md.
dependencies = [
    # The markups writer and the extension vocabulary. A DIRECT dependency,
    # not merely a `tool.uv.sources` entry: a source only applies to a package
    # that is actually depended on, so declaring the path without this line
    # installs nothing and the import fails at runtime.
    "sadt-ali-common",
    "torch==2.11.0",
    # Transitive through pytorch3d's stack, listed here because
    # `tool.uv.sources` applies to DIRECT dependencies only. Left transitive it
    # comes from PyPI, built against the default torch rather than the cu128
    # one -- the version pairing is right and it still fails at runtime with
    # `operator torchvision::nms does not exist`.
    "torchvision==0.26.0",
    "pytorch3d==0.7.9+pt2110cu128",
    # The 2D UNet that predicts the per-view masks. A different network from the
    # CBCT engine's DenseNet, from the same library -- which is why the split
    # does NOT let this tool drop monai.
    "monai==1.6.0",
    "vtk==9.6.2",
    "numpy==2.3.2",
    # Not used directly: torch pulls it in. From 3.30 it installs a process-wide
    # audit hook that raises on an os.fork while another thread is mid-fork with
    # a lock held ("os.fork is unsafe while filelock is changing descriptor
    # ownership"), which lost a structure in one AMASSS run in two. 3.29 has none.
    "filelock<3.30",
]

# What makes this directory a tool. A directory holding a pyproject.toml
# WITHOUT this section -- `../common`, `../../../testkit` -- is a plain
# package, importable and installable, never discovered or served.
[tool.sadt]
tool = true
# The API identity: what a client sends, what deployment.toml is keyed by, and
# what another tool passes to `sup.run()`. Declared rather than derived from the
# directory, so this tool keeps its name while living inside a grouping folder.
name = "ALI_IOS"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_ali_ios"]

# `explicit` is load-bearing on both: without it uv looks for EVERY package on
# these indexes, and most are not there. It is also what makes them PINNED
# SOURCES rather than extra index URLs -- as an extra index uv is free to mix
# registries, which is how a torch 2.11.0+cu130 got paired with a pt2120cu126
# wheel that imports and then dies on a missing libcudart.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# The prebuilt pytorch3d wheels upstream itself installs from: every ALI/AREG/
# ASO/DOCShapeAXI/FlexReg module ships an `install_pytorch.py` that reads this
# index and picks the wheel whose `+ptXXXcuYYY` tag matches the installed torch.
[[tool.uv.index]]
name = "pytorch3d-wheels"
url = "https://ImageMindAnalytics.github.io/pytorch3d-wheels/simple/"
explicit = true

[tool.uv.sources]
# The markups writer and the input-extension vocabulary, shared with ALI_CBCT
# because they are contracts with the outside world rather than internal code.
# See ../common/README.md; it has no dependencies of its own, which is what
# lets it install into two environments whose pins are incompatible.
sadt-ali-common = { path = "../common" }
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does.
sadt-testkit = { path = "../../../testkit", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
pytorch3d = { index = "pytorch3d-wheels" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# DESELECTED, not skipped: a skip is a line of output somebody has to read and
# decide about on every run, and neither of these can pass without hardware or
# weights nobody is expected to have. Ask for them by name -- `pytest -m gpu`,
# `pytest -m models` -- which overrides this.
addopts = "-m 'not gpu and not models'"
markers = [
    "gpu: needs a CUDA device. Deselected by default; run it by hand and report the result in the PR.",
    "models: needs the real IOS model bundle. See tests/data/README.md.",
]
