[project]
name = "sadt-areg-cbct"
version = "0.1.0"
description = "Register a follow-up CBCT onto its baseline with elastix."
requires-python = ">=3.11,<3.12"
# No pytorch3d here, and so no reason to move torch. AREG_IOS is pinned to 2.11
# because its pytorch3d wheel names that version exactly; this engine was only
# ever dragged along by sharing a virtualenv with it, which the split undid.
dependencies = [
    "sadt-areg-common",
    "torch==2.8.0",
    "itk==5.4.7",
    "itk-elastix==0.23.0",
    "SimpleITK==2.5.6",
    "numpy==2.3.2",
    "dicom2nifti==2.6.2",
    # Not used directly: torch pulls it in. From 3.30 it installs a process-wide
    # audit hook that raises on an os.fork while another thread is mid-fork with
    # a lock held ("os.fork is unsafe while filelock is changing descriptor
    # ownership"), which lost a structure in one AMASSS run in two. 3.29 has none.
    "filelock<3.30",
]

[tool.sadt]
tool = true
name = "AREG_CBCT"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_areg_cbct"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
sadt-areg-common = { path = "../common" }
sadt-testkit = { path = "../../../testkit", editable = true }
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs a real model bundle and is skipped without it. See tests/data/README.md.",
]
