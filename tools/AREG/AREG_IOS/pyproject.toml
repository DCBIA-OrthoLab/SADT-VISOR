[project]
name = "sadt-areg-ios"
version = "0.1.0"
description = "Register a follow-up intraoral scan onto its baseline by ICP on a stable patch."
requires-python = ">=3.11,<3.12"
# Aligned with upstream's shared shapeaxi env, where every pytorch3d-dependent
# module lives. Upstream leaves torch unpinned there; we are stricter, because
# the pytorch3d wheel tag (`+pt2110cu128`) names one torch version and one CUDA
# variant exactly -- the two move together or the C extension does not load.
dependencies = [
    "sadt-areg-common",
    "torch==2.11.0",
    # Transitive, listed because `tool.uv.sources` applies to DIRECT
    # dependencies only. Left transitive it comes from PyPI, built against the
    # default torch rather than the cu128 one: right version, wrong build, and
    # it fails at runtime on `operator torchvision::nms does not exist`.
    "torchvision==0.26.0",
    "pytorch3d==0.7.9+pt2110cu128",
    "monai==1.6.0",
    "SimpleITK==2.5.6",
    "numpy==2.3.2",
    "vtk==9.6.2",
    # Not used directly: torch pulls it in. From 3.30 it installs a process-wide
    # audit hook that raises on an os.fork while another thread is mid-fork with
    # a lock held ("os.fork is unsafe while filelock is changing descriptor
    # ownership"), which lost a structure in one AMASSS run in two. 3.29 has none.
    "filelock<3.30",
]

[tool.sadt]
tool = true
name = "AREG_IOS"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_areg_ios"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch3d-wheels"
url = "https://ImageMindAnalytics.github.io/pytorch3d-wheels/simple/"
explicit = true

[tool.uv.sources]
sadt-areg-common = { path = "../common" }
sadt-testkit = { path = "../../../testkit", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
pytorch3d = { index = "pytorch3d-wheels" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs a real model bundle and is skipped without it. See tests/data/README.md.",
]
