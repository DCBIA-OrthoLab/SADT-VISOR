[project]
name = "sadt-aso"
version = "0.1.0"
description = "Orient CBCT scans or intra-oral scans onto a standard reference frame."
# The deployment image's interpreter (lab-ai:2026.08, python 3.11.13), which is
# where every ASO result to date was produced. Nothing here constrains it
# further: this is the one migrated tool with no torch in it.
requires-python = ">=3.11,<3.12"
dependencies = [
    # The naming vocabulary every tool must agree on: extensions, output
    # markers, jaw and timepoint tokens. A DIRECT dependency, not merely a `tool.uv.sources` entry:
    # a source only applies to a package that is actually depended on.
    "sadt-naming",
    "SimpleITK==2.5.6",
    "vtk==9.6.2",
    "numpy==2.3.2",
    # CBCT only, and only with dicom_input. Kept a hard dependency all the same:
    # it is a pure-python wheel next to SimpleITK, and the alternative is an
    # optional extra whose absence is discovered halfway through a batch.
    "dicom2nifti==2.6.2",
]

# What makes this directory a tool. A directory holding a pyproject.toml
# WITHOUT this section -- a shared path dependency, the testkit -- is a plain
# package: importable, installable, never discovered or served.
#
# `name` is the API identity: what a client sends, what deployment.toml is keyed
# by, and what another tool passes to `sup.run()`. Declared rather than derived
# from the directory so a folder can be reorganised without breaking the HTTP
# contract -- moving ALI_CBCT under a grouping folder is exactly that case.
[tool.sadt]
tool = true
name = "ASO"

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_aso"]

[tool.uv.sources]
# Which extensions count as a volume, a surface, a set of landmarks. Shared
# rather than copied because it is a contract with the outside world, not an
# internal helper -- see CONTRIBUTING.md, and the `.stl` ALI advertised and
# never read. It has no dependencies of its own and cannot perturb the
# resolution above.
sadt-naming = { path = "../../naming" }
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does -- which is how the
# supervisor is exercised end to end. It has no dependencies of its own, so it
# cannot perturb the resolution above. Never move it into [project]
# dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
    "models: needs a real reference bundle and is skipped without it. See tests/data/README.md.",
]
