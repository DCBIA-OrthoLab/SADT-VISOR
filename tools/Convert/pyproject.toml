[project]
name = "sadt-convert"
version = "0.1.0"
description = "Convert 3D scans between file formats, and DICOM series to a volume."
# Same interpreter as ASO and AREG_CBCT, whose DICOM conversion this tool is meant
# to replace one day.
requires-python = ">=3.11,<3.12"
dependencies = [
    "sadt-naming",
    "SimpleITK==2.5.6",
]

[tool.sadt]
tool = true
name = "Convert"

[dependency-groups]
dev = ["pytest==8.3.4", "numpy==2.3.2", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_convert"]

[tool.uv.sources]
sadt-naming = { path = "../../naming" }
sadt-testkit = { path = "../../testkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
