[project]
name = "sadt-crownseg"
version = "0.1.0"
description = "Label every tooth of an intraoral scan with its dental number."
# The deployment image's interpreter (lab-ai:2026.08, python 3.11.13), and the
# only one pytorch3d is built for there.
requires-python = ">=3.11,<3.12"
# Everything the tool needs EXCEPT the segmentation engine. Kept apart on
# purpose -- see the extra below and README.md.
dependencies = [
    # Upstream's shared "shapeaxi" conda env leaves torch unpinned, so it
    # resolves to whatever is current (>= 2.11 today). We are deliberately
    # STRICTER: an unpinned torch is not reproducible, and the pytorch3d wheel
    # tag (`+pt2110cu128`) names one torch version and one CUDA variant
    # exactly. Bumping torch here means bumping that tag in the same commit.
    "torch==2.11.0",
    "vtk==9.6.2",
    "numpy==2.3.2",
    # Not used directly: torch pulls it in. From 3.30 it installs a process-wide
    # audit hook that raises on an os.fork while another thread is mid-fork with
    # a lock held ("os.fork is unsafe while filelock is changing descriptor
    # ownership"), which lost a structure in one AMASSS run in two. 3.29 has none.
    "filelock<3.30",
]

# The engine, matching upstream SlicerAutomatedDentalTools' shared env:
# shapeaxi >= 2.0.2, ocnn == 2.2.1, SimpleITK. It stays an extra so a plain
# `uv sync` can still import the package and publish its schema without
# pulling the GPU stack; `uv sync --extra segmentation` builds the real thing.
# What makes this directory a tool. A directory holding a pyproject.toml
# WITHOUT this section -- a shared path dependency, the testkit -- is a plain
# package: importable, installable, never discovered or served.
#
# `name` is the API identity: what a client sends, what deployment.toml is keyed
# by, and what another tool passes to `sup.run()`. Declared rather than derived
# from the directory so a folder can be reorganised without breaking the HTTP
# contract -- moving ALI_CBCT under a grouping folder is exactly that case.
[tool.sadt]
tool = true
name = "Crown_Seg"

[project.optional-dependencies]
segmentation = [
    "shapeaxi>=2.0.2",
    "ocnn==2.2.1",
    "SimpleITK",
    "pytorch3d==0.7.9+pt2110cu128",
    # Transitive through shapeaxi, listed here for the SAME reason pytorch3d
    # is: sources apply to direct dependencies only. Left transitive it comes
    # from PyPI, and PyPI's torchvision is built against the default torch
    # rather than the cu128 one -- the version pairing is right (0.26 <-> 2.11)
    # but the C extension links a different build, so importing it raises
    # `RuntimeError: operator torchvision::nms does not exist`. Measured, not
    # anticipated.
    "torchvision==0.26.0",
]

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_crownseg"]

# `explicit` is load-bearing: without it uv looks for EVERY package on the
# PyTorch index, and most of them are not there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# The prebuilt pytorch3d wheels upstream itself installs from: every ALI/AREG/
# ASO/DOCShapeAXI/FlexReg module ships an `install_pytorch.py` that reads this
# index and picks the wheel whose `+ptXXXcuYYY` tag matches the installed
# torch. `explicit` is what makes it a PINNED SOURCE rather than an extra
# index: as an `--extra-index-url` uv is free to mix registries, which is how
# a torch 2.11.0+cu130 got paired with a pt2120cu126 wheel -- it imports and
# then dies on the first CUDA kernel with a missing libcudart.
[[tool.uv.index]]
name = "pytorch3d-wheels"
url = "https://ImageMindAnalytics.github.io/pytorch3d-wheels/simple/"
explicit = true

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does. It has no dependencies of
# its own, so it cannot perturb the resolution above. Never move it into
# [project] dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# pytorch3d has no usable PyPI distribution (newest there is 0.7.4, cp38-cp310
# only), which is why it used to be compiled from git against the pinned torch
# -- tens of minutes and a CUDA toolkit. Upstream does not do that: it installs
# a prebuilt wheel from the index above, and so do we now.
#
# It is listed in the extra ABOVE as a direct dependency even though shapeaxi
# pulls it transitively, because `tool.uv.sources` only applies to direct
# dependencies -- left transitive, uv ignores this source and fails with
# "no wheels with a matching Python version tag".
pytorch3d = { index = "pytorch3d-wheels" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselected by DEFAULT, not merely skipped: a plain `pytest` must not depend on
# a card, on the `segmentation` extra, or on a 16 MB mesh being staged -- and a
# suite whose green line is half skips says nothing. Run them by hand with
# `-m models -o addopts=` and report the result in the PR.
addopts = "-m 'not gpu and not models'"
markers = [
    "gpu: needs a CUDA device. Deselected by default; run it by hand and report the result in the PR.",
    "models: needs the real checkpoint and mesh, named by SADT_CROWNSEG_MODEL and SADT_CROWNSEG_MESH, and the `segmentation` extra. Deselected by default. See tests/data/README.md.",
]
