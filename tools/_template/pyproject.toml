[project]
name = "sadt-template"
version = "0.1.0"
description = "Reference package showing the run() contract every SADT-VISOR tool follows."
# Accurate, not aspirational: numpy 1.26.4 publishes no wheel past 3.12, and an
# open-ended ">=3.11" makes uv pick 3.14 and spend a quarter-hour building it
# from source -- or fail. Bound `requires-python` by what the pins support.
requires-python = ">=3.11,<3.13"
# Pin what the port actually used. A tool's dependencies are a scientific
# decision: bumping torch/monai/numpy can change model outputs, so a bump means
# revalidating against reference data, not just a green test run.
dependencies = ["numpy==1.26.4"]

# What makes a copy of this template a TOOL (CONTRIBUTING.md, section 2).
# Uncomment it in the copy, never here: CI and the server key on this section,
# and the template is a plain package.
#
# [tool.sadt]
# tool = true
# name = "MyTool"
# # Bump by one in a release that changes what the tool COSTS -- a new or
# # larger model, a different handling of the input's size -- so the server
# # drops the RAM/VRAM it learned from the previous release and relearns it.
# # Absent is 0. Not for an ordinary release: learned figures are worth keeping.
# # cost_epoch = 1

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device. Skipped in CI (`-m 'not gpu'`); run it by hand and report the result in the PR.",
]

# A tool needing a CUDA-variant wheel declares its own index, and `explicit`
# is load-bearing: without it uv looks for EVERY package on that index.
#
# [[tool.uv.index]]
# name = "pytorch-cu118"
# url = "https://download.pytorch.org/whl/cu118"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu118" }

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does. It has no dependencies of
# its own, so it cannot perturb the resolution above. Never move it into
# [project] dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }
